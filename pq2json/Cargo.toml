[package]
name = "pq2json"
version = "0.1.0"
authors = ["Evgeney Ryzhyk <evgeneyr@microsoft.com>"]
edition = "2021"

[dependencies]
clap = "2"
parquet = { path = "../arrow-rs/parquet", default-features = false, features = [
    "snap",
    "brotli",
    "flate2-rust_backened",
    "lz4",
    "base64",
    "experimental",
    "zstd",
]}
itertools = "0"
serde = "1"
serde_json = "1"
num-bigint = "0"
chrono = "0"
csv = "1"
ryu = "1"
uuid = "1"
